name: Build and Release DeX Launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dex-launcher-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk

      - name: Build Rust core with cargo-ndk
        run: |
          mkdir -p app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o app/src/main/jniLibs build --release --manifest-path rust-core/Cargo.toml
          ls -la app/src/main/jniLibs/*

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Release APK
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found, checking debug APK fallback..."
            ./gradlew assembleDebug --stacktrace
            APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" dist/dex-launcher-v0.1.0-pre.apk
          ls -la dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dex-launcher-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create Pre-Release on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ -z "$TAG" || "$TAG" == "main" || "$TAG" == "master" ]]; then
            TAG="v0.1.0-pre"
          fi

          NOTES="### 🚀 DeX Launcher v0.1.0-pre (Initial Pre-Release)

Samsung DeX-inspired desktop launcher for Android & HarmonyOS tablets (optimized for HUAWEI MatePad Air).

#### ✨ Fitur Unggulan:
- 🖥️ **Samsung DeX Inspired Interface:** Taskbar di bawah dengan tombol Start, Pinned Apps, dan System Tray.
- 🦀 **Rust Core Native Engine:** Fuzzy search aplikasi super cepat via JNI bindings (`dex_core`).
- 🎨 **Kustomisasi Icon:** Mendukung bentuk *Squircle*, *Circle*, *Rounded*, *Teardrop*, penyesuaian ukuran icon slider (40-72dp), dan sembunyikan/tampilkan label.
- 🪟 **Floating Windows Native HarmonyOS:** Menghormati manajemen multi-window dan sidebar dock bawaan Huawei tanpa konflik.
- 🔋 **Live System Tray:** Status baterai real-time, indikator WiFi/Jaringan, dan jam digital.

#### 📦 Instalasi:
1. Unduh file \`dex-launcher-v0.1.0-pre.apk\` di bawah.
2. Pasang di tablet (izinkan instalasi dari sumber tidak dikenal jika diminta).
3. Buka Pengaturan > Aplikasi > Aplikasi Standar > Beranda/Peluncur > Pilih **DeX Launcher**."

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating assets..."
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --title "DeX Launcher v0.1.0-pre (Preview)" \
              --notes "$NOTES" \
              --prerelease
          fi
