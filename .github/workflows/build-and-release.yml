name: Build and Release DeX Launcher

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dex-launcher-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust Targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk

      - name: Build Rust Core Libraries
        run: |
          export ANDROID_NDK_HOME=$(ls -d $ANDROID_SDK_ROOT/ndk/* | tail -n 1)
          echo "Using Android NDK: $ANDROID_NDK_HOME"
          mkdir -p app/src/main/jniLibs
          cd rust-core
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release
          cd ..
          ls -la app/src/main/jniLibs/*

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Release APK
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Package APK for Release
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found, checking debug APK fallback..."
            ./gradlew assembleDebug --stacktrace
            APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" dist/dex-launcher-v0.1.0-pre.apk
          ls -la dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dex-launcher-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ -z "$TAG" || "$TAG" == "main" || "$TAG" == "master" ]]; then
            TAG="v0.1.0-pre"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating assets..."
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --title "DeX Launcher v0.1.0-pre (Preview)" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
